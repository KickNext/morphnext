name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Match tag to pubspec
        shell: bash
        run: |
          package_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${package_version}" >&2
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Generate example icon catalog
        run: dart run tool/generate_example_icon_catalog.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Validate package
        run: dart pub publish --dry-run

  check-version:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      published: ${{ steps.lookup.outputs.published }}

    steps:
      - name: Check whether the version is already published
        id: lookup
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://pub.dev/api/packages/morphnext/versions/${version}")"
          case "${status}" in
            200) echo "published=true" >> "${GITHUB_OUTPUT}" ;;
            404) echo "published=false" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "pub.dev returned HTTP ${status}" >&2
              exit 1
              ;;
          esac

  publish:
    needs: check-version
    if: needs.check-version.outputs.published != 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
    with:
      environment: pub.dev

  release:
    needs: [check-version, publish]
    if: >-
      always() &&
      needs.check-version.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
