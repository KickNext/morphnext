name: morphnext_example
description: Demonstrates interruptible vector morphing with morphnext.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tabler_icons: ^1.43.0
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  go_router: ^17.5.0
  google_fonts: ^8.1.0
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.15
  morphnext:
    path: ..
  reel_text: ^0.4.4
  remixicon: ^4.9.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/github.svg
    - assets/icons/pubdev.svg
