    :root {
      color-scheme: light dark;
      --loader-background: #202124;
      --loader-caption: #9aa0a6;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --loader-background: #f8f9fa;
        --loader-caption: #5f6368;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--loader-background);
    }

    #flutter-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--loader-background);
      opacity: 1;
      transition: opacity 180ms ease-out;
    }

    #flutter-loader.is-hidden {
      pointer-events: none;
      opacity: 0;
    }

    .loader-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .loader-message {
      width: min(280px, calc(100vw - 48px));
      min-height: 18px;
      margin: 0;
      color: var(--loader-caption);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity 160ms ease,
        transform 160ms ease;
    }

    .loader-message.is-changing {
      opacity: 0;
      transform: translateY(4px);
    }

    /* From Uiverse.io by andrew-manzyk */
    .loader {
      --main-color: #4387f4;
      transform: scale(1); /* You can change the size */
      z-index: 999;
    }

    .loader svg {
      width: 100px;
      height: 100px;
    }

    .loader svg path:first-child {
      will-change: d;
      fill: var(--main-color);
      animation: morph 2s ease-in-out infinite;
    }

    .loader svg path:not(:first-child) {
      fill: none;
      stroke: var(--main-color);
      stroke-width: 0;
    }

    .loader svg path:nth-child(2) {
      animation: wave 2s linear infinite;
      animation-delay: 1.7s;
    }

    .loader svg path:nth-child(3) {
      animation: wave 2s linear infinite;
      animation-delay: 0.3s;
    }

    .loader svg path:nth-child(4) {
      animation: wave 2s linear infinite;
      animation-delay: 1s;
    }

    @keyframes wave {
      0% {
        stroke-width: 0;
        transform: scale(1) translateX(0px) translateY(0px);
        opacity: 0;
      }
      10% {

        transform: scale(1.05) translateX(-2.25px) translateY(-2.25px);
        opacity: 0.3;
      }
      30% {
        stroke-width: 10;
        transform: scale(1.1) translateX(-4.5px) translateY(-4.5px);
        opacity: 0;
      }
      100% {
        stroke-width: 0;

      }
